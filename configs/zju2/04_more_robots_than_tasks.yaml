test_expectations:
  robots: 6
  tasks: 3
  idle_robots: 3
  minimum_merged_stops: 0

map:
  directory: ../../maps/zju2
  allow_unknown: false
  inflation_radius_m: 0.0

output_directory: ../../output/zju2/04_more_robots_than_tasks

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 1.0
    total_load_weight: 0.1
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.5

export:
  path_thickness: 3
  draw_grid: false

robots:
- id: fire-near
  start:
    map_id: map_000
    local_xy: [1.725, -1.125]
  capabilities: [fire]
  return_home:
    map_id: map_000
    local_xy: [1.725, -1.125]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: fire-far
  start:
    map_id: map_000
    local_xy: [0.375, 11.575]
  capabilities: [fire]
  return_home:
    map_id: map_000
    local_xy: [0.375, 11.575]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: camera-near
  start:
    map_id: map_000
    local_xy: [10.975, 3.575]
  capabilities: [camera]
  return_home:
    map_id: map_000
    local_xy: [10.975, 3.575]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: camera-far
  start:
    map_id: map_000
    local_xy: [-5.625, 10.125]
  capabilities: [camera]
  return_home:
    map_id: map_000
    local_xy: [-5.625, 10.125]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: thermal-near
  start:
    map_id: map_000
    local_xy: [-2.475, 8.725]
  capabilities: [thermal]
  return_home:
    map_id: map_000
    local_xy: [-2.475, 8.725]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: reserve
  start:
    map_id: map_000
    local_xy: [-3.625, 5.325]
  capabilities: [delivery]
  return_home:
    map_id: map_000
    local_xy: [-3.625, 5.325]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0

tasks:
- id: only-fire
  location:
    map_id: map_000
    local_xy: [3.475, 1.825]
  requirements: [fire]
  category: fire_suppression
  service_seconds: 5
- id: only-photo
  location:
    map_id: map_000
    local_xy: [9.025, 6.525]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 2
- id: only-thermal
  location:
    map_id: map_000
    local_xy: [-3.325, 11.675]
  requirements: [thermal]
  category: thermal_inspection
  service_seconds: 4
