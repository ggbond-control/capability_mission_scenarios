version: 1
test_expectations: {robots: 6, tasks: 3, idle_robots: 3, minimum_merged_stops: 0}
map: {directory: ../../maps/zju2, allow_unknown: false, inflation_radius_m: 0.0}
output_directory: ../../output/single_map_scenarios/04_more_robots_than_tasks
planner:
  coordinate_conflicts: true
  objective: {maximum_load_weight: 1.0, total_load_weight: 0.1}
  traversal: {time_step_seconds: 0.1, nominal_speed_mps: 0.5}
export: {path_thickness: 3, draw_grid: false}
robots:
  - {id: fire-near, start: {map_id: map_000, grid: [417, 62]}, capabilities: [fire], return_home: true}
  - {id: fire-far, start: {map_id: map_000, grid: [390, 316]}, capabilities: [fire], return_home: true}
  - {id: camera-near, start: {map_id: map_000, grid: [602, 156]}, capabilities: [camera], return_home: true}
  - {id: camera-far, start: {map_id: map_000, grid: [270, 287]}, capabilities: [camera], return_home: true}
  - {id: thermal-near, start: {map_id: map_000, grid: [333, 259]}, capabilities: [thermal], return_home: true}
  - {id: reserve, start: {map_id: map_000, grid: [310, 191]}, capabilities: [delivery], return_home: true}
tasks:
  - {id: only-fire, location: {map_id: map_000, grid: [452, 121]}, requirements: [fire], category: fire_suppression, service_seconds: 5}
  - {id: only-photo, location: {map_id: map_000, grid: [563, 215]}, requirements: [camera], category: gimbal_photo, service_seconds: 2}
  - {id: only-thermal, location: {map_id: map_000, grid: [316, 318]}, requirements: [thermal], category: thermal_inspection, service_seconds: 4}
