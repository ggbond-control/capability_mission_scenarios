test_expectations:
  robots: 3
  tasks: 12
  idle_robots: 0
  minimum_merged_stops: 0

map:
  directory: ../../maps/zju2
  allow_unknown: false
  inflation_radius_m: 0.0

output_directory: ../../output/zju2/03_overlapping_capabilities

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 2.0
    total_load_weight: 0.05
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.5

export:
