test_expectations:
  robots: 4
  tasks: 12
  idle_robots: 1
  minimum_merged_stops: 4

map:
  directory: ../../maps/zju2
  allow_unknown: false
  inflation_radius_m: 0.0

output_directory: ../../output/zju2/06_shared_sites

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 1.0
    total_load_weight: 0.2
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.5

export:
  path_thickness: 4
  draw_grid: false

robots:
- id: fire-camera
  start:
    map_id: map_000
    local_xy: [-3.625, 5.325]
  capabilities: [fire, camera]
  return_home:
    map_id: map_000
    local_xy: [-3.625, 5.325]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: thermal-camera
  start:
    map_id: map_000
    local_xy: [10.975, 3.575]
  capabilities: [thermal, camera]
  return_home:
    map_id: map_000
    local_xy: [10.975, 3.575]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: fire-thermal
  start:
    map_id: map_000
    local_xy: [0.375, 11.575]
  capabilities: [fire, thermal]
  return_home:
    map_id: map_000
    local_xy: [0.375, 11.575]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: universal
  start:
    map_id: map_000
    local_xy: [1.725, -1.125]
  capabilities: [fire, camera, thermal]
  return_home:
    map_id: map_000
    local_xy: [1.725, -1.125]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0

tasks:
- id: site-a-fire
  location:
    map_id: map_000
    local_xy: [-5.625, 10.125]
  requirements: [fire]
  category: fire_suppression
  service_seconds: 6
  high_priority: true
- id: site-a-photo
  location:
    map_id: map_000
    local_xy: [-5.625, 10.125]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 2
- id: site-a-thermal
  location:
    map_id: map_000
    local_xy: [-5.625, 10.125]
  requirements: [thermal]
  category: thermal_inspection
  service_seconds: 3
- id: site-b-fire
  location:
    map_id: map_000
    local_xy: [9.025, 6.525]
  requirements: [fire]
  category: fire_suppression
  service_seconds: 5
- id: site-b-photo
  location:
    map_id: map_000
    local_xy: [9.025, 6.525]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 2
- id: site-b-document
  location:
    map_id: map_000
    local_xy: [9.025, 6.525]
  requirements: [fire, camera]
  category: fire_documentation
  service_seconds: 5
- id: site-c-thermal
  location:
    map_id: map_000
    local_xy: [-2.475, 8.725]
  requirements: [thermal]
  category: thermal_inspection
  service_seconds: 4
- id: site-c-photo
  location:
    map_id: map_000
    local_xy: [-2.475, 8.725]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 2
- id: site-c-assess
  location:
    map_id: map_000
    local_xy: [-2.475, 8.725]
  requirements: [fire, thermal]
  category: hazard_assessment
  service_seconds: 7
  high_priority: true
- id: site-d-fire
  location:
    map_id: map_000
    local_xy: [3.475, 1.825]
  requirements: [fire]
  category: fire_suppression
  service_seconds: 5
- id: site-d-photo
  location:
    map_id: map_000
    local_xy: [3.475, 1.825]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 2
- id: site-d-thermal
  location:
    map_id: map_000
    local_xy: [3.475, 1.825]
  requirements: [thermal]
  category: thermal_inspection
  service_seconds: 3
