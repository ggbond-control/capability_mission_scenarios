test_expectations:
  robots: 1
  tasks: 8
  idle_robots: 0
  minimum_merged_stops: 1

map:
  directory: ../../maps/zju2
  allow_unknown: false
  inflation_radius_m: 0.0

output_directory: ../../output/zju2/01_single_generalist

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 1.0
    total_load_weight: 0.1
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.5

export:
  path_thickness: 3
  draw_grid: false

robots:
- id: generalist
  start:
    map_id: map_000
    local_xy: [-3.625, 5.325]
  capabilities: [fire, camera, thermal, delivery]
  return_home:
    map_id: map_000
    local_xy: [-3.625, 5.325]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0

tasks:
- id: photo-west
  location:
    map_id: map_000
    local_xy: [-5.625, 10.125]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 3
  high_priority: true
- id: fire-south
  location:
    map_id: map_000
    local_xy: [1.725, -1.125]
  requirements: [fire]
  category: fire_suppression
  service_seconds: 6
- id: thermal-east
  location:
    map_id: map_000
    local_xy: [10.975, 3.575]
  requirements: [thermal]
  category: thermal_inspection
  service_seconds: 4
- id: delivery-north
  location:
    map_id: map_000
    local_xy: [0.375, 11.575]
  requirements: [delivery]
  category: material_delivery
  service_seconds: 5
- id: document-center
  location:
    map_id: map_000
    local_xy: [4.525, 6.125]
  requirements: [fire, camera]
  category: fire_documentation
  service_seconds: 7
- id: thermal-west
  location:
    map_id: map_000
    local_xy: [-5.925, 3.725]
  requirements: [thermal]
  category: thermal_inspection
  service_seconds: 2
- id: photo-center
  location:
    map_id: map_000
    local_xy: [0.075, 6.775]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 2
- id: thermal-center
  location:
    map_id: map_000
    local_xy: [0.075, 6.775]
  requirements: [thermal]
  category: thermal_inspection
  service_seconds: 3
