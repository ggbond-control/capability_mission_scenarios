version: 1
test_expectations: {robots: 4, tasks: 10, idle_robots: 0, minimum_merged_stops: 0}
map: {directory: ../../maps/zju2, allow_unknown: false, inflation_radius_m: 0.0}
output_directory: ../../output/single_map_scenarios/02_four_specialists
planner:
  coordinate_conflicts: true
  objective: {maximum_load_weight: 1.0, total_load_weight: 0.15}
  traversal: {time_step_seconds: 0.1, nominal_speed_mps: 0.6}
export: {path_thickness: 3, draw_grid: false}
robots:
  - {id: fire-unit, start: {map_id: map_000, grid: [310, 191]}, capabilities: [fire, camera], return_home: true}
  - {id: camera-unit, start: {map_id: map_000, grid: [602, 156]}, capabilities: [camera], return_home: true}
  - {id: thermal-unit, start: {map_id: map_000, grid: [390, 316]}, capabilities: [thermal, camera], return_home: true}
  - {id: carrier-unit, start: {map_id: map_000, grid: [417, 62]}, capabilities: [delivery, lift], return_home: true}
tasks:
  - {id: fire-1, location: {map_id: map_000, grid: [270, 287]}, requirements: [fire], category: fire_suppression, service_seconds: 8, high_priority: true}
  - {id: fire-photo, location: {map_id: map_000, grid: [365, 128]}, requirements: [fire, camera], category: fire_documentation, service_seconds: 6}
  - {id: photo-1, location: {map_id: map_000, grid: [563, 215]}, requirements: [camera], category: gimbal_photo, service_seconds: 2}
  - {id: photo-2, location: {map_id: map_000, grid: [513, 157]}, requirements: [camera], category: gimbal_photo, service_seconds: 2}
  - {id: thermal-1, location: {map_id: map_000, grid: [333, 259]}, requirements: [thermal], category: thermal_inspection, service_seconds: 4}
  - {id: thermal-photo, location: {map_id: map_000, grid: [418, 262]}, requirements: [thermal, camera], category: thermal_documentation, service_seconds: 5}
  - {id: delivery-1, location: {map_id: map_000, grid: [452, 121]}, requirements: [delivery], category: material_delivery, service_seconds: 5}
  - {id: heavy-delivery, location: {map_id: map_000, grid: [264, 159]}, requirements: [delivery, lift], category: heavy_delivery, service_seconds: 9, high_priority: true}
  - {id: fire-2, location: {map_id: map_000, grid: [473, 207]}, requirements: [fire], category: fire_suppression, service_seconds: 5}
  - {id: photo-3, location: {map_id: map_000, grid: [316, 318]}, requirements: [camera], category: gimbal_photo, service_seconds: 3}
