test_expectations:
  robots: 4
  tasks: 10
  idle_robots: 0
  minimum_merged_stops: 0

map:
  directory: ../../maps/zju2
  allow_unknown: false
  inflation_radius_m: 0.0

output_directory: ../../output/zju2/02_four_specialists

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 1.0
    total_load_weight: 0.15
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.6

export:
  path_thickness: 3
  draw_grid: false

robots:
- id: fire-unit
  start:
    map_id: map_000
    local_xy: [-3.625, 5.325]
  capabilities: [fire, camera]
  return_home:
    map_id: map_000
    local_xy: [-3.625, 5.325]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: camera-unit
  start:
    map_id: map_000
    local_xy: [10.975, 3.575]
  capabilities: [camera]
  return_home:
    map_id: map_000
    local_xy: [10.975, 3.575]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: thermal-unit
  start:
    map_id: map_000
    local_xy: [0.375, 11.575]
  capabilities: [thermal, camera]
  return_home:
    map_id: map_000
    local_xy: [0.375, 11.575]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
- id: carrier-unit
  start:
    map_id: map_000
    local_xy: [1.725, -1.125]
  capabilities: [delivery, lift]
  return_home:
    map_id: map_000
    local_xy: [1.725, -1.125]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0

tasks:
- id: fire-1
  location:
    map_id: map_000
    local_xy: [-5.625, 10.125]
  requirements: [fire]
  category: fire_suppression
  service_seconds: 8
  high_priority: true
- id: fire-photo
  location:
    map_id: map_000
    local_xy: [-0.875, 2.175]
  requirements: [fire, camera]
  category: fire_documentation
  service_seconds: 6
- id: photo-1
  location:
    map_id: map_000
    local_xy: [9.025, 6.525]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 2
- id: photo-2
  location:
    map_id: map_000
    local_xy: [6.525, 3.625]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 2
- id: thermal-1
  location:
    map_id: map_000
    local_xy: [-2.475, 8.725]
  requirements: [thermal]
  category: thermal_inspection
  service_seconds: 4
- id: thermal-photo
  location:
    map_id: map_000
    local_xy: [1.775, 8.875]
  requirements: [thermal, camera]
  category: thermal_documentation
  service_seconds: 5
- id: delivery-1
  location:
    map_id: map_000
    local_xy: [3.475, 1.825]
  requirements: [delivery]
  category: material_delivery
  service_seconds: 5
- id: heavy-delivery
  location:
    map_id: map_000
    local_xy: [-5.925, 3.725]
  requirements: [delivery, lift]
  category: heavy_delivery
  service_seconds: 9
  high_priority: true
- id: fire-2
  location:
    map_id: map_000
    local_xy: [4.525, 6.125]
  requirements: [fire]
  category: fire_suppression
  service_seconds: 5
- id: photo-3
  location:
    map_id: map_000
    local_xy: [-3.325, 11.675]
  requirements: [camera]
  category: gimbal_photo
  service_seconds: 3
