test_expectations:
  robots: 5
  tasks: 60
  idle_robots: 0
  minimum_merged_stops: 0

map:
  directory: ../../maps/bdz1
  allow_unknown: false
  inflation_radius_m: 0.0
  inscribed_radius_m: 0.2
  cost_scaling_factor: 10.0

output_directory: ../../output/bdz1/05_five_robot_types_60_points

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 1.5
    total_load_weight: 0.1
    multi_start: 1
    normalize: false
    time_budget_seconds: 10.0
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.8
    obstacle_cost_weight: 1.0
    allow_diagonal: true
    downsample_costmap: true
    coarse_search_factor: 4

export:
  path_thickness: 3
  draw_grid: false

