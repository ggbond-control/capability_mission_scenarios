map:
  directory: ../../maps/bdz1
  allow_unknown: false
  inflation_radius_m: 0.0
  inscribed_radius_m: 0.2
  cost_scaling_factor: 10.0

output_directory: ../../output/bdz1/02_homogeneous_shortest_path_benchmark

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 1.0
    total_load_weight: 0.05
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.8
    obstacle_cost_weight: 1.0
    allow_diagonal: true
    downsample_costmap: true
    coarse_search_factor: 4

export:
  path_thickness: 4
  draw_grid: false

robots:
- id: homo-a
  start:
    map_id: bdz1
    local_xy: [2.35, 35.95]
  capabilities: [inspection]
  return_home:
    map_id: bdz1
    local_xy: [2.35, 35.95]
  clearance_radius_m: 0.01
  safety_margin_m: 0.0
  nominal_speed_mps: 0.8
