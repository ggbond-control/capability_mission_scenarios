version: 1

# Homogeneous benchmark: every robot has the same capability set and every
# point requests the same operation. This isolates route-length balancing from
# capability matching and task-service heterogeneity.
map:
  directory: ../../maps/bdz1
  allow_unknown: false
  inflation_radius_m: 0.0
  inscribed_radius_m: 0.20
  cost_scaling_factor: 10.0

output_directory: ../../output/bdz1/02_homogeneous_shortest_path_benchmark

planner:
  coordinate_conflicts: false
  objective:
    maximum_load_weight: 1.0
    total_load_weight: 0.05
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.8
    obstacle_cost_weight: 1.0
    allow_diagonal: true
    downsample_costmap: true
    coarse_search_factor: 2

export: {path_thickness: 4, draw_grid: false}

robots:
  - {id: homo-a, start: {map_id: bdz1, grid: [100, 1036]}, capabilities: [inspection], return_home: true, clearance_radius_m: 0.01, safety_margin_m: 0.00, nominal_speed_mps: 0.8}
  - {id: homo-b, start: {map_id: bdz1, grid: [2258, 1043]}, capabilities: [inspection], return_home: true, clearance_radius_m: 0.01, safety_margin_m: 0.00, nominal_speed_mps: 0.8}
  - {id: homo-c, start: {map_id: bdz1, grid: [129, 110]}, capabilities: [inspection], return_home: true, clearance_radius_m: 0.01, safety_margin_m: 0.00, nominal_speed_mps: 0.8}

# Identical inspection jobs, evenly spread over the two central corridors.
tasks:
  - {id: inspect-01, location: {map_id: bdz1, grid: [300, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-02, location: {map_id: bdz1, grid: [500, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-03, location: {map_id: bdz1, grid: [700, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-04, location: {map_id: bdz1, grid: [900, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-05, location: {map_id: bdz1, grid: [1100, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-06, location: {map_id: bdz1, grid: [1300, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-07, location: {map_id: bdz1, grid: [1500, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-08, location: {map_id: bdz1, grid: [1700, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-09, location: {map_id: bdz1, grid: [1900, 651]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-10, location: {map_id: bdz1, grid: [500, 351]}, requirements: [inspection], category: inspection, service_seconds: 1}
  - {id: inspect-11, location: {map_id: bdz1, grid: [1300, 351]}, requirements: [inspection], category: inspection, service_seconds: 1}
