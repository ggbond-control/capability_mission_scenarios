version: 1
test_expectations: {robots: 5, tasks: 80, idle_robots: 0, minimum_merged_stops: 0}

map:
  directory: ../../maps/bdz1
  allow_unknown: false
  inflation_radius_m: 0.0
  inscribed_radius_m: 0.20
  cost_scaling_factor: 10.0

output_directory: ../../output/bdz1/06_five_robot_types_80_points

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 1.5
    total_load_weight: 0.1
    multi_start: 1
    normalize: false
    time_budget_seconds: 10.0
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.8
    obstacle_cost_weight: 1.0
    allow_diagonal: true
    downsample_costmap: true
    coarse_search_factor: 4

export: {path_thickness: 3, draw_grid: false}

# Five deliberately different capability profiles.
robots:
  - {id: fire-camera-gas, start: {map_id: bdz1, grid: [100, 1036]}, capabilities: [fire, camera, gas], return_home: true, clearance_radius_m: 0.01, safety_margin_m: 0.00, nominal_speed_mps: 0.8}
  - {id: camera-thermal-delivery, start: {map_id: bdz1, grid: [2258, 1043]}, capabilities: [camera, thermal, delivery], return_home: true, clearance_radius_m: 0.01, safety_margin_m: 0.00, nominal_speed_mps: 0.8}
  - {id: fire-thermal-delivery, start: {map_id: bdz1, grid: [129, 110]}, capabilities: [fire, thermal, delivery], return_home: true, clearance_radius_m: 0.01, safety_margin_m: 0.00, nominal_speed_mps: 0.9}
  - {id: fire-delivery-gas, start: {map_id: bdz1, grid: [180, 1036]}, capabilities: [fire, delivery, gas], return_home: true, clearance_radius_m: 0.01, safety_margin_m: 0.00, nominal_speed_mps: 0.8}
  - {id: camera-thermal-gas, start: {map_id: bdz1, grid: [2050, 1043]}, capabilities: [camera, thermal, gas], return_home: true, clearance_radius_m: 0.01, safety_margin_m: 0.00, nominal_speed_mps: 0.8}

# Fifty unique points distributed across four east-west corridors. Requirements cycle
